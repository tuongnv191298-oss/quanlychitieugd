<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Login - AI Bank</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111827;
padding:30px;
border-radius:12px;
width:320px;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
outline:none;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#22c55e;
color:white;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#16a34a;
}

.link{
text-align:center;
margin-top:10px;
color:#aaa;
font-size:14px;
}

.link a{
color:#22c55e;
text-decoration:none;
font-weight:bold;
}

.link a:hover{
text-decoration:underline;
}
</style>
</head>

<body>

<div class="box">

<h2>🔐 LOGIN</h2>

<form method="POST" action="/login">

<input name="user" placeholder="Username" required>
<input type="password" name="pass" placeholder="Password" required>

<button type="submit">
<i class="fa fa-right-to-bracket"></i> Login
</button>

</form>

<div class="link">
Chưa có tài khoản?
<a href="/register">Đăng ký</a>
</div>

</div>

</body>
</html>
